name: Deploy Batch Sentiment Analysis App
on: 
  push:
    branches: 
      - dev
  #workflow_dispatch:
    
jobs:
  first_job:
    name: My first job
    runs-on: ubuntu-latest
    steps:
      - name: Greet the user
        run: echo "Hello World"
        shell: bash
      - run: echo "Date is  \n ${{ github.actor}}"
        shell: bash  ##optional by default bash on non windows platforms
        ## http://docs.github.com/en/actions/reference/workflows-and-actions/expressions
        ## https://docs.github.com/en/actions/reference/workflows-and-actions/contexts
      - run: |
          echo "Hello world from ${{ github.actor }}."
          echo "Current branch is '${{ github.ref }}'."
      - name: Checkout
        uses: actions/checkout@v5.0.0
      - name: Tree
        run: tree
      - run: |
          echo "Hello ${{ vars.WHO_TO_GREET }} from ${{ github.
          actor }}."
          echo "My secret is ${{ secrets.MY_SECRET }}."
  Test:
    runs-on: ubuntu-latest
    environment: Test
    needs: first_job
    steps:
      - run: |
          echo "Hello ${{ vars.WHO_TO_GREET }} from ${{ github.actor }}."
          sec=$(echo ${{ secrets.MY_SECRET }} | sed 's/./& /g')
          echo "My secret is '$sec'."
  Production:
    runs-on: ubuntu-latest
    environment: 
      name: Production
      url: https://writeabout.net
    needs: [Test]
    steps:
      - run: |
          echo "Hello ${{ vars.WHO_TO_GREET }} from ${{ github.actor }}."
          sec=$(echo ${{ secrets.MY_SECRET }} | sed 's/./& /g')
          echo "My secret is '$sec'."
  
